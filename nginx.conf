server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES: cleanUrls  /print -> print.html
    location = /print {
        try_files /print.html =404;
    }

    # EN: /en -> en/index.html ; /en/print -> en/print.html
    location = /en {
        try_files /en/index.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }
    location = /en/print {
        try_files /en/print.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # cache de assets
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
